name: Build Windows

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # GODOT 4.7.2 + EXPORT TEMPLATES
      # ============================================================

      - name: Setup Godot
        uses: lihop/setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true
          cache: true


      # ============================================================
      # VERIFY GODOT
      # ============================================================

      - name: Verify Godot
        shell: powershell
        run: |
          Write-Host "Godot version:"
          godot --version


      # ============================================================
      # IMPORT PROJECT
      # ============================================================

      - name: Import Godot project
        shell: powershell
        run: |
          Write-Host "Importing CIGA project..."

          godot `
            --headless `
            --path "$PWD" `
            --editor `
            --quit

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Godot project import failed."
            exit $LASTEXITCODE
          }


      # ============================================================
      # PREPARE BUILD DIRECTORY
      # ============================================================

      - name: Prepare build directory
        shell: powershell
        run: |
          if (Test-Path "build") {
            Remove-Item `
              "build" `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "build" |
            Out-Null


      # ============================================================
      # BUILD WINDOWS
      # ============================================================

      - name: Build Windows
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "CIGA WINDOWS BUILD"
          Write-Host "========================================"

          Write-Host "Godot:"
          godot --version

          Write-Host ""
          Write-Host "Preset:"
          Write-Host "Windows Desktop"

          Write-Host ""
          Write-Host "Output:"
          Write-Host "$PWD\build\CIGA Interaction Studio.exe"

          godot `
            --headless `
            --path "$PWD" `
            --export-release `
            "Windows Desktop" `
            "$PWD\build\CIGA Interaction Studio.exe"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Godot exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Error "CIGA Windows export failed."
            exit $exitCode
          }


      # ============================================================
      # INSPECT BUILD
      # ============================================================

      - name: Inspect build output
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "BUILD OUTPUT"
          Write-Host "========================================"

          if (!(Test-Path "build")) {
            Write-Error "Build directory does not exist."
            exit 1
          }

          $files = Get-ChildItem `
            -Path "build" `
            -Recurse `
            -Force

          if ($files.Count -eq 0) {
            Write-Error "Build directory is empty."
            exit 1
          }

          $files |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "========================================"
          Write-Host "EXE / PCK FILES"
          Write-Host "========================================"

          $outputs = Get-ChildItem `
            -Path "build" `
            -Recurse `
            -Force `
            -Include *.exe,*.pck

          if ($outputs.Count -eq 0) {
            Write-Error "No .exe or .pck files were created."
            exit 1
          }

          $outputs |
            Select-Object FullName, Length


      # ============================================================
      # UPLOAD BUILD
      # ============================================================

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: CIGA-Interaction-Studio-Windows
          path: build/
          if-no-files-found: error

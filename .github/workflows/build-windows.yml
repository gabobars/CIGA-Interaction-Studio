name: Build Windows

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # DOWNLOAD GODOT 4.7.2
      # ============================================================

      - name: Download Godot 4.7.2
        shell: powershell
        run: |
          $godotZip = "$env:TEMP\godot.zip"
          $godotDir = "$env:TEMP\godot"

          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" `
            -OutFile $godotZip

          if (Test-Path $godotDir) {
            Remove-Item $godotDir -Recurse -Force
          }

          Expand-Archive `
            -Path $godotZip `
            -DestinationPath $godotDir `
            -Force


      # ============================================================
      # FIND GODOT
      # ============================================================

      - name: Find Godot
        shell: powershell
        run: |
          $godot = Get-ChildItem `
            "$env:TEMP\godot" `
            -Filter "Godot_v4.7.2-stable_win64.exe" `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $godot) {
            Write-Error "Godot 4.7.2 executable not found."
            exit 1
          }

          Write-Host "Godot found:"
          Write-Host $godot.FullName

          "GODOT_PATH=$($godot.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # ============================================================
      # DOWNLOAD EXPORT TEMPLATES
      # ============================================================

      - name: Download Godot export templates
        shell: powershell
        run: |
          $templatesTpz = "$env:TEMP\godot-export-templates.tpz"

          $templatesUrl = `
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"

          Write-Host "Downloading Godot 4.7.2 export templates..."

          Invoke-WebRequest `
            -Uri $templatesUrl `
            -OutFile $templatesTpz

          if (!(Test-Path $templatesTpz)) {
            Write-Error "Export templates download failed."
            exit 1
          }

          Write-Host "Export templates downloaded."


      # ============================================================
      # INSTALL EXPORT TEMPLATES
      # ============================================================

      - name: Install Godot export templates
        shell: powershell
        run: |
          $templatesTpz = "$env:TEMP\godot-export-templates.tpz"

          $godotEditorData = `
            Join-Path $env:APPDATA "Godot"

          $templatesDirectory = `
            Join-Path $godotEditorData "export_templates\4.7.2.stable"

          if (Test-Path $templatesDirectory) {
            Remove-Item `
              $templatesDirectory `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $templatesDirectory |
            Out-Null

          Write-Host "Installing templates to:"
          Write-Host $templatesDirectory

          $extractDirectory = "$env:TEMP\godot-template-extract"

          if (Test-Path $extractDirectory) {
            Remove-Item `
              $extractDirectory `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $extractDirectory |
            Out-Null

          tar `
            -xf $templatesTpz `
            -C $extractDirectory

          Write-Host "Extracted template contents:"

          Get-ChildItem `
            -Path $extractDirectory `
            -Recurse `
            -Force |
            Select-Object FullName, Length

          $innerTemplateDirectory = `
            Join-Path $extractDirectory "templates"

          if (Test-Path $innerTemplateDirectory) {

            Copy-Item `
              -Path "$innerTemplateDirectory\*" `
              -Destination $templatesDirectory `
              -Recurse `
              -Force

          } else {

            Copy-Item `
              -Path "$extractDirectory\*" `
              -Destination $templatesDirectory `
              -Recurse `
              -Force
          }

          Write-Host "Installed export templates:"

          Get-ChildItem `
            -Path $templatesDirectory `
            -Recurse `
            -Force |
            Select-Object FullName, Length


      # ============================================================
      # VERIFY EXPORT TEMPLATE
      # ============================================================

      - name: Verify Windows export template
        shell: powershell
        run: |
          $templatesDirectory = `
            Join-Path $env:APPDATA "Godot\export_templates\4.7.2.stable"

          $windowsTemplate = `
            Join-Path `
              $templatesDirectory `
              "windows_release_x86_64.exe"

          if (!(Test-Path $windowsTemplate)) {

            Write-Host "Installed template directory:"
            
            if (Test-Path $templatesDirectory) {
              Get-ChildItem `
                -Path $templatesDirectory `
                -Recurse `
                -Force |
                Select-Object FullName, Length
            }

            Write-Error `
              "Windows x86_64 release export template was not found."

            exit 1
          }

          Write-Host "Windows export template found:"
          Write-Host $windowsTemplate


      # ============================================================
      # IMPORT GODOT PROJECT
      # ============================================================

      - name: Import Godot project
        shell: powershell
        run: |
          Write-Host "Importing Godot project..."

          & "$env:GODOT_PATH" `
            --headless `
            --path "$PWD" `
            --editor `
            --quit

          $exitCode = $LASTEXITCODE

          Write-Host "Godot import exit code: $exitCode"

          if ($exitCode -ne 0) {
            exit $exitCode
          }


      # ============================================================
      # PREPARE BUILD DIRECTORY
      # ============================================================

      - name: Prepare build directory
        shell: powershell
        run: |
          if (Test-Path "build") {
            Remove-Item `
              "build" `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "build" |
            Out-Null


      # ============================================================
      # BUILD WINDOWS
      # ============================================================

      - name: Build Windows
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Starting CIGA Windows export"
          Write-Host "========================================"

          Write-Host "Godot:"
          Write-Host "$env:GODOT_PATH"

          Write-Host "Project:"
          Write-Host "$PWD"

          Write-Host "Preset:"
          Write-Host "Windows Desktop"

          Write-Host "Output:"
          Write-Host "$PWD\build\CIGA Interaction Studio.exe"

          & "$env:GODOT_PATH" `
            --headless `
            --path "$PWD" `
            --export-release `
            "Windows Desktop" `
            "$PWD\build\CIGA Interaction Studio.exe"

          $exitCode = $LASTEXITCODE

          Write-Host "========================================"
          Write-Host "Godot exit code: $exitCode"
          Write-Host "========================================"

          if ($exitCode -ne 0) {
            Write-Error "Godot Windows export failed."
            exit $exitCode
          }


      # ============================================================
      # INSPECT BUILD OUTPUT
      # ============================================================

      - name: Inspect build output
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "BUILD DIRECTORY"
          Write-Host "========================================"

          if (!(Test-Path "build")) {
            Write-Error "Build directory does not exist."
            exit 1
          }

          $files = Get-ChildItem `
            -Path "build" `
            -Recurse `
            -Force

          if ($files.Count -eq 0) {
            Write-Error `
              "Build directory exists but contains no files."

            exit 1
          }

          $files |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "========================================"
          Write-Host "EXE / PCK FILES"
          Write-Host "========================================"

          $outputs = Get-ChildItem `
            -Path "." `
            -Recurse `
            -Force `
            -Include *.exe,*.pck `
            -ErrorAction SilentlyContinue

          if ($outputs.Count -eq 0) {
            Write-Error `
              "No .exe or .pck files were found."

            exit 1
          }

          $outputs |
            Select-Object FullName, Length


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: CIGA-Interaction-Studio-Windows
          path: build/
          if-no-files-found: error

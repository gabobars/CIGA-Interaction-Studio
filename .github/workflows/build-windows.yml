name: Build Windows

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # GODOT 4.7.2 + EXPORT TEMPLATES
      # ============================================================

      - name: Setup Godot
        uses: lihop/setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true
          cache: true


      # ============================================================
      # DEFINE GODOT PATH
      # ============================================================

      - name: Define Godot path
        shell: powershell
        run: |
          $godotPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "v4.7.2-stable\Godot_v4.7.2-stable_win64.exe"

          Write-Host "Godot path:"
          Write-Host $godotPath

          if (!(Test-Path $godotPath)) {
            Write-Error "Godot executable was not found."
            exit 1
          }

          "GODOT_PATH=$godotPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # ============================================================
      # VERIFY GODOT
      # ============================================================

      - name: Verify Godot
        shell: powershell
        run: |
          Write-Host "Godot executable:"
          Write-Host "$env:GODOT_PATH"

          & "$env:GODOT_PATH" --version

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Godot version check failed."
            exit $LASTEXITCODE
          }


      # ============================================================
      # IMPORT PROJECT
      # ============================================================

      - name: Import CIGA project
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "IMPORTING CIGA PROJECT"
          Write-Host "========================================"

          & "$env:GODOT_PATH" `
            --headless `
            --path "$env:GITHUB_WORKSPACE" `
            --editor `
            --quit

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Godot import exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Error "Godot project import failed."
            exit $exitCode
          }


      # ============================================================
      # PREPARE BUILD DIRECTORY
      # ============================================================

      - name: Prepare build directory
        shell: powershell
        run: |
          if (Test-Path "build") {
            Remove-Item `
              "build" `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "build" |
            Out-Null


      # ============================================================
      # BUILD WINDOWS
      # ============================================================

      - name: Build Windows
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "CIGA WINDOWS BUILD"
          Write-Host "========================================"

          Write-Host "Godot:"
          Write-Host "$env:GODOT_PATH"

          Write-Host ""
          Write-Host "Preset:"
          Write-Host "Windows Desktop"

          Write-Host ""
          Write-Host "Output:"
          Write-Host "$env:GITHUB_WORKSPACE\build\CIGA Interaction Studio.exe"

          & "$env:GODOT_PATH" `
            --headless `
            --path "$env:GITHUB_WORKSPACE" `
            --export-release `
            "Windows Desktop" `
            "$env:GITHUB_WORKSPACE\build\CIGA Interaction Studio.exe"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Godot export exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Error "CIGA Windows export failed."
            exit $exitCode
          }


      # ============================================================
      # INSPECT BUILD OUTPUT
      # ============================================================

      - name: Inspect build output
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "BUILD OUTPUT"
          Write-Host "========================================"

          if (!(Test-Path "build")) {
            Write-Error "Build directory does not exist."
            exit 1
          }

          $files = Get-ChildItem `
            -Path "build" `
            -Recurse `
            -Force

          if ($files.Count -eq 0) {
            Write-Error "Build directory is empty."
            exit 1
          }

          $files |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "========================================"
          Write-Host "EXE / PCK FILES"
          Write-Host "========================================"

          $outputs = Get-ChildItem `
            -Path "build" `
            -Recurse `
            -Force `
            -Include *.exe,*.pck

          if ($outputs.Count -eq 0) {
            Write-Error "No .exe or .pck files were created."
            exit 1
          }

          $outputs |
            Select-Object FullName, Length


      # ============================================================
      # UPLOAD BUILD
      # ============================================================

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: CIGA-Interaction-Studio-Windows
          path: build/
          if-no-files-found: error
